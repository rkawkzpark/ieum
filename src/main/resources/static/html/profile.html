<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이음 - 마이페이지</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="data:,">  </head>
<body>
<div class="container">
    <h1>마이페이지</h1>

    <div id="profile-view">
        <div class="profile-item">
            <strong>이름</strong>
            <p id="display-name"></p>
        </div>
        <div class="profile-item">
            <strong>자기소개</strong>
            <p id="display-intro"></p>
        </div>
        <button id="edit-btn">수정하기</button>
    </div>

    <form id="profile-edit-form" style="display: none;">
        <div>
            <label for="input-name">이름</label>
            <input type="text" id="input-name" name="name" required>
        </div>
        <div>
            <label for="input-intro">자기소개</label>
            <textarea id="input-intro" name="introduction"></textarea>
        </div>
        <button type="submit">저장하기</button>
    </form>
</div>

<script src="../js/profile.js"></script>
</body>
</html>
